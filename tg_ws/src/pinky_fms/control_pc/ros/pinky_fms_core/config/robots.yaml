# 관제 설정. 로봇은 보통 GUI 의 '로봇 추가'에서 ID(namespace)·IP·사용자·비밀번호를 입력해 등록한다.
# 모든 로봇은 같은 ROS_DOMAIN_ID 안에서 namespace(=로봇 ID)로 구분한다 (/amr_01/..., /amr_02/...).
domain_id: 16
heartbeat_timeout_sec: 3.0     # 이 시간 동안 로봇 데이터(배터리·odom·amcl_pose)가 안 오면 OFFLINE 으로 본다

# DDS 탐색 방식. Wi-Fi 에서 멀티캐스트 탐색이 불안정해 통신이 끊기면 unicast 로 바꾼다.
#   multicast: 기본(자동 탐색) / unicast: 멀티캐스트를 끄고 로봇이 관제PC IP 를 직접 지정 (RMW: rmw_cyclonedds_cpp)
# unicast 로 바꾸면 관제PC 터미널/프로세스에도 `source src/pinky_fms/fms_env.sh` 로 같은 설정을 적용해야 한다.
network:
  discovery: unicast            # 로봇 자체 AP 에서 멀티캐스트 탐색이 끊겨 unicast 로 전환 (실물 로봇으로 양방향 확인)
  interface: wlp0s20f3          # 관제PC 의 Wi-Fi 인터페이스 이름 (예: wlp0s20f3). unicast 일 때 관제PC 쪽에만 적용. 비우면 자동
  max_participants: 100         # 한 PC 에서 동시에 뜨는 ROS 프로세스 수보다 크게
  extra_peers: []               # (선택) 미리 아는 로봇 IP. 보통 비워도 된다 (로봇이 먼저 관제PC 를 찾아온다)

# 차선 미션 목표를 관제 경로 계획(pinky_fms_lane lane_route)에 맡길지. true 이면 GUI 가 목표를 /fleet/lane_goal 로 보내고,
# lane_route 가 코스 모델로 목표를 차선 위에 맞춰(멀면 이유와 함께 거부) 경로·갈림길 동작을 붙여 lane_cmd 로 보낸다.
# false(또는 없음)이면 예전처럼 GUI 가 lane_cmd 를 직접 보내고 로봇이 지도로 갈림길 방향을 고른다.
lane_route: true

# GUI 에서 추가하는 로봇에 공통으로 쓰는 값. {namespace} 는 로봇 ID 로 자동 치환된다.
defaults:
  user: pinky                   # SSH 사용자 (GUI 에서 로봇마다 바꿀 수 있음)
  mode: ssh                     # ssh: 실제 로봇에 SSH 로 접속 / local: 이 PC 에서 가짜 로봇 실행(테스트)
  ws_setup: source /opt/ros/jazzy/setup.bash && source ~/pinky_pro/install/setup.bash   # 로봇의 colcon 워크스페이스
  launch_cmd: ros2 launch pinky_fms_bringup robot_bringup.launch.xml namespace:={namespace}
  # 주행 스택: 미션 종류에 따라 bringup 위에 하나만 띄운다 (둘 다 cmd_vel 을 쓰므로 동시에 띄우지 않는다).
  # GUI 에서 미션을 실행하면 백엔드가 SSH 로 켜고 끈다. {namespace} = 로봇 ID, {map} = robot_map, {lane_map} = lane_map
  stacks:
    nav: ros2 launch pinky_fms_bringup robot_nav.launch.xml namespace:={namespace} map:={map}       # Goal Navigation / Coordinated Fleet Navigation
    lane: ros2 launch pinky_fms_bringup robot_lane.launch.xml namespace:={namespace} map:={lane_map}   # Vision-based Lane Following (미션 선택 시 실행, 목적지는 Go 때 lane_cmd 로)
  robot_map: /home/pinky/mission4_3_clean_1cm.yaml   # 로봇에 있는 Nav2 지도 (관제PC 의 traffic_core 지도와 같은 좌표여야 한다)
  lane_map: /home/pinky/mission4_3_lanes_1cm.yaml    # Lane Following 용 지도: 벽은 같고 차선만 빈 칸 (갈림길·출발 방향 판단이 차선을 따라간다). 같은 좌표여야 한다

# (선택) GUI 에 항상 표시할 고정 로봇. 키가 로봇 ID = namespace. GUI 에서는 지울 수 없다.
# 보통은 비워 두고 GUI 의 '로봇 추가'를 쓴다.
robots: {}
