<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinky FMS Live View</title>
    <!-- 관제 GUI(index.html) 카드의 카메라 버튼이 여는 별도 창: 지도 위 로봇 이동 + 로봇 시점 주행 영상 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        :root { --bg: #020617; --panel: #0f172a; --line: #1e293b; --text: #e2e8f0; --muted: #64748b; --ok: #34d399; --bad: #f43f5e; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
        body { display: flex; flex-direction: column; }
        header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
        header h1 { font-size: 14px; margin: 0; font-weight: 700; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 6px; }
        .dot.on { background: var(--ok); }
        .muted { color: var(--muted); }
        main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 40%); gap: 10px; padding: 10px; min-height: 0; }
        #map-wrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; overflow: hidden; }
        #map { width: 100%; height: 100%; display: block; }
        #map-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; pointer-events: none; }
        #cams { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
        .cam { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; flex: 1 1 0; min-height: 200px; display: flex; flex-direction: column; }
        .cam.sel { border-color: var(--c); }
        .cam-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--line); }
        .cam-head b { color: var(--c); }
        .cam-head .st { margin-left: auto; font-family: monospace; font-size: 11px; }
        .cam-body { position: relative; flex: 1; background: #000; display: flex; align-items: center; justify-content: center; min-height: 0; }
        .cam-body img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .cam-body .msg { position: absolute; padding: 0 16px; text-align: center; color: var(--muted); font-size: 12px; }
        .cam-body .fps { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color: var(--ok); font: 10px monospace; padding: 2px 6px; border-radius: 4px; }
        .live { position: absolute; top: 6px; right: 6px; display: none; align-items: center; gap: 5px; background: #dc2626; color: #fff; font: 700 10px Inter, sans-serif; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; }
        .live.on { display: inline-flex; }
        .dist { position: absolute; bottom: 8px; right: 8px;   /* 왼쪽 아래는 차선 영상의 좌표 글자 자리 */ display: none; background: rgba(0,0,0,.7); color: #fff; font: 600 13px Inter, sans-serif; padding: 4px 10px; border-radius: 6px; border-left: 3px solid var(--c); }
        .dist.on { display: block; }
        .dist small { color: #94a3b8; font-weight: 400; font-size: 10px; margin-left: 4px; }
        .live i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }
        @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 50vh auto; } }
    </style>
</head>
<body>
    <header>
        <h1>Pinky FMS · Live View</h1>
        <span><span id="ros-dot" class="dot"></span><span id="ros-text">rosbridge 연결 중…</span></span>
        <span class="muted">지도: <span id="map-name">--</span></span>
        <span class="muted" style="margin-left:auto">영상 칸을 누르면 지도에서 그 로봇을 강조합니다 · 선은 최근 60초 이동 경로</span>
    </header>
    <main>
        <div id="map-wrap"><canvas id="map"></canvas><div id="map-msg">지도를 불러오는 중…</div></div>
        <div id="cams"></div>
    </main>
    <script src="live.js"></script>
</body>
</html>
